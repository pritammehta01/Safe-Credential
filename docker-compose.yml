version: "3.8"
services:
  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - mongodb
  frontend:
    container_name: frontend
    build: .
    ports:
      - "80:80"
    restart: always
volumes:
  mongo_data:

