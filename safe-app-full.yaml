# ==========================================
# 1. MongoDB Persistence (PVC)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ==========================================
# 2. MongoDB Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# ==========================================
# 3. Backend Deployment (Node.js/Express)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-backend
  template:
    metadata:
      labels:
        app: safe-backend
    spec:
      containers:
        - name: backend
          # Jenkins will update this tag during 'kubectl set image'
          image: pritammehta/safe-backend:latest 
          imagePullPolicy: Always
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017"
          ports:
            - containerPort: 5000
          # Critical for GKE Gateway Health Checks
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: safe-backend-service
  annotations:
    # Required for GKE Container-Native Load Balancing
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: safe-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
# ==========================================
# 4. Frontend Deployment (React/Nginx)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safe-frontend
  template:
    metadata:
      labels:
        app: safe-frontend
    spec:
      containers:
        - name: frontend
          image: pritammehta/safe-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: safe-frontend-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: safe-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
