# =======================
# MongoDB (Persistent)
# =======================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

# =======================
# Backend
# =======================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-backend
  template:
    metadata:
      labels:
        app: safe-backend
    spec:
      containers:
        - name: backend
          image: pritammehta/safe-backend
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: safe-backend-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: safe-backend
  ports:
    - port: 5000
      targetPort: 5000

# =======================
# Frontend
# =======================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safe-frontend
  template:
    metadata:
      labels:
        app: safe-frontend
    spec:
      containers:
        - name: frontend
          image: pritammehta/safe-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: safe-frontend-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: safe-frontend
  ports:
    - port: 80
      targetPort: 80
