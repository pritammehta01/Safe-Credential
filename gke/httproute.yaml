apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: safe-credential-route
  namespace: default
spec:
  parentRefs:
  - name: safe-gateway
  rules:
  # ---------------------------------------------------------
  # Rule 1: Backend API (Matches /api)
  # ---------------------------------------------------------
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          # This ensures that /api stays as /api when it hits Express
          replacePrefixMatch: /api 
    backendRefs:
    - name: safe-backend-service
      port: 5000

  # ---------------------------------------------------------
  # Rule 2: Frontend (Catch-all for /)
  # ---------------------------------------------------------
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: safe-frontend-service
      port: 80
