# ==========================================
# 1. MongoDB (StatefulSet & Service)
# ==========================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: "mongo-service"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      volumes:
          - name: mongo-storage
            emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# ==========================================
# 2. Backend (Deployment & Service)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-backend
spec:
  replicas: 1 # Increased for high availability
  selector:
    matchLabels:
      app: safe-backend
  template:
    metadata:
      labels:
        app: safe-backend
    spec:
      containers:
        - name: backend
          image: pritammehta/safe-backend:6
          imagePullPolicy: Always
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017"
          ports:
            - containerPort: 5000
          # Probes tell GKE when the pod is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: safe-backend-service
spec:
#  type: NodePort
  selector:
    app: safe-backend
  ports:
  - port: 5000
    targetPort: 5000
 #   nodePort: 30500
    
---
# ==========================================
# 3. Frontend (Deployment & Service)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safe-frontend
  template:
    metadata:
      labels:
        app: safe-frontend
    spec:
      containers:
        - name: frontend
          image: pritammehta/safe-frontend:6
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: safe-frontend-service
spec:
 # type: NodePort
  selector:
    app: safe-frontend
  ports:
  - port: 80
    targetPort: 80
  #  nodePort: 30080
