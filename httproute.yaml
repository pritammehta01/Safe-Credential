apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: safe-credential-route
spec:
  parentRefs:
  - name: safe-gateway
  rules:
  # Route /api/v1 to your Backend (Port 5000)
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1
    backendRefs:
    - name: safe-backend-service
      port: 5000

  # Route everything else to your Frontend (Port 80)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: safe-frontend-service
      port: 80
