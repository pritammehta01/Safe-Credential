apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: safe-credential-route
spec:
  parentRefs:
  - name: traefik-gateway
  hostnames:
  - "safe.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: / 
    backendRefs:
    - name: safe-backend-service
      port: 5000 # This matches the 'port' in your Service YAML
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: safe-frontend-service
      port: 80
