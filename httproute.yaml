apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: safe-credential-route
  namespace: default
spec:
  parentRefs:
  - name: safe-gateway

  rules:
  # Backend API
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: safe-backend-service
      port: 5000

  # Frontend (catch-all)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: safe-frontend-service
      port: 80
